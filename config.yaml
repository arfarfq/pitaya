# Units are seconds, volts, Hz, and samples unless a key says otherwise.
# Edit this file, then run: uv run python main.py
# Relative output paths are resolved against this file's directory.
mode:
  dummy: false # true prepares locally without upload or acquisition

connection:
  host: rp-f0f7aa.local
  port: 5000
  socket_timeout_s: 5.0

waveform:
  one_second: false # debug mode scales time and divides frequency by the factor below
  debug_time_factor: 100
  fundamental_hz: 105000
  duration_s: 0.010
  min_duration_s: 0.001
  max_duration_s: 0.010
  decay_time_s: 0.003
  amplitude_v: 0.8
  phase_rad: 0.0
  samples: 16384 # fixed length of the standard hardware waveform buffer

noise:
  enabled: true
  snr_db: 20.0
  seed: null # integer for a reproducible sequence between program launches
  headroom_sigma: 6.0

acquisition:
  adc_rate_hz: 125000000 # must match your board
  decimation: 64
  pre_trigger_s: 0.001
  post_trigger_s: 0.001
  arm_delay_s: 0.02
  capture_timeout_s: 3.0 # extra allowance beyond the capture duration
  poll_interval_s: 0.01
  read_block_samples: 8192

output:
  save_data: true
  directory: outputs

plot:
  enabled: true
  figsize: [10, 4]
  linewidth: 0.7
  grid_alpha: 0.3

# Defaults retained for the separate DataProcessor helpers; main.py currently
# performs acquisition, saving and plotting without FFT or mass calibration.
fft:
  padding_factor: 8
  cutoff_khz: 500

decay:
  expected_frequency_hz: 100000
  prominence_fraction: 0.05

calibration:
  ref_khz: 105.912
  ref_mz: 38.9637065
