[project]
name = "pitaya"
version = "0.1.0"
description = "Red Pitaya waveform acquisition and FFT mass spectrum analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9.2",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "scipy>=1.16.2",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""
source-include = ["config.yaml", "main.py"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
